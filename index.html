<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
    <script>
      // In the iframe preview, Vite's @vite/client creates a WebSocket for HMR
      // that can't connect and throws "WebSocket closed without opened".
      // 1. Mock the WebSocket so @vite/client never gets the chance to throw.
      // 2. Suppress the error message at all levels as a backup.
      (function () {
        var MSG = 'WebSocket closed without opened';

        // 1. Override WebSocket — mock connections to the Vite dev server (same origin or localhost)
        // Real app WebSockets (cross-origin, different host) pass through unchanged.
        var OriginalWebSocket = window.WebSocket;

        function MockWebSocket(url, protocols) {
          var self = this;
          var listeners = {};

          this.readyState = 0; // CONNECTING
          this.url = url;
          this.extensions = '';
          this.protocol = '';
          this.binaryType = 'blob';
          this.bufferedAmount = 0;
          this.onopen = null;
          this.onclose = null;
          this.onerror = null;
          this.onmessage = null;

          this.addEventListener = function (type, listener) {
            if (!listeners[type]) listeners[type] = [];
            listeners[type].push(listener);
          };
          this.removeEventListener = function (type, listener) {
            if (!listeners[type]) return;
            listeners[type] = listeners[type].filter(function (l) { return l !== listener; });
          };
          this.dispatchEvent = function (event) {
            var arr = listeners[event.type];
            if (arr) arr.forEach(function (l) { try { l(event); } catch (e) {} });
            var handler = self['on' + event.type];
            if (typeof handler === 'function') { try { handler(event); } catch (e) {} }
            return true;
          };
          this.send = function () {};
          this.close = function () {};

          // Fire a fake 'open' so @vite/client thinks HMR connected.
          // Never fire 'close' — prevents "WebSocket closed without opened".
          setTimeout(function () {
            self.readyState = 1; // OPEN
            try { self.dispatchEvent({ type: 'open' }); } catch (e) {}
          }, 0);
        }
        MockWebSocket.CONNECTING = 0;
        MockWebSocket.OPEN = 1;
        MockWebSocket.CLOSING = 2;
        MockWebSocket.CLOSED = 3;

        // Only mock WebSocket connections to the Vite dev server (same origin or localhost).
        // Real app WebSockets (Base44 SDK realtime subscriptions, cross-origin) pass through
        // to the real implementation so they can connect/reconnect normally.
        window.WebSocket = function (url, protocols) {
          var isViteHmr = false;
          try {
            var parsed = new URL(url, window.location.origin);
            isViteHmr = parsed.origin === window.location.origin ||
                        parsed.hostname === 'localhost' ||
                        parsed.hostname === '127.0.0.1';
          } catch (e) {
            isViteHmr = false; // unparseable URL → let real WebSocket handle it
          }
          if (isViteHmr) {
            return new MockWebSocket(url, protocols);
          }
          return new OriginalWebSocket(url, protocols);
        };
        window.WebSocket.prototype = OriginalWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;

        // 2. Backup: filter the WebSocket error message everywhere it might surface
        var origConsoleError = console.error;
        var origConsoleWarn = console.warn;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          if (args.some(function (a) { return typeof a === 'string' && a.indexOf(MSG) !== -1; })) return;
          return origConsoleError.apply(console, args);
        };
        console.warn = function () {
          var args = Array.prototype.slice.call(arguments);
          if (args.some(function (a) { return typeof a === 'string' && a.indexOf(MSG) !== -1; })) return;
          return origConsoleWarn.apply(console, args);
        };

        window.onerror = function (message, source, lineno, colno, error) {
          if (typeof message === 'string' && message.indexOf(MSG) !== -1) return true;
          if (error && error.message && error.message.indexOf(MSG) !== -1) return true;
        };
        window.addEventListener('error', function (e) {
          var msg = e.message || (e.error && e.error.message) || '';
          if (typeof msg === 'string' && msg.indexOf(MSG) !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var msg = (e.reason && e.reason.message) || '';
          if (typeof msg === 'string' && msg.indexOf(MSG) !== -1) {
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

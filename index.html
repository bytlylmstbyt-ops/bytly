<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
    <script>
      // In the iframe preview, Vite's HMR WebSocket can't connect and throws
      // "WebSocket closed without opened". Override the global WebSocket
      // constructor to silently no-op same-origin connections (Vite dev server).
      // Cross-origin WebSocket connections (e.g. Base44 realtime API) are unaffected.
      (function () {
        if (window.top === window) return; // Only in iframe
        var OriginalWebSocket = window.WebSocket;
        window.WebSocket = function (url, protocols) {
          try {
            var parsed = new URL(url, window.location.href);
            var isSameOrigin = parsed.origin === window.location.origin;
            if (isSameOrigin) {
              // Return a silent mock — never opens, never throws
              return {
                readyState: 3, CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3,
                url: url, extensions: '', protocol: '', binaryType: 'blob',
                bufferedAmount: 0,
                send: function () {}, close: function () {},
                addEventListener: function () {}, removeEventListener: function () {},
                dispatchEvent: function () { return false; },
                onopen: null, onclose: null, onerror: null, onmessage: null
              };
            }
          } catch (e) { /* fall through to original */ }
          return new OriginalWebSocket(url, protocols);
        };
        window.WebSocket.prototype = OriginalWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

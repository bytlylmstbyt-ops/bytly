<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
    <script>
      // In the iframe preview, Vite's @vite/client creates a WebSocket for HMR
      // that can't connect ("WebSocket closed without opened"). Suppress this
      // harmless error at multiple levels.
      (function () {
        var MSG = 'WebSocket closed without opened';

        // 1. Filter console.error / console.warn — Vite logs the error here
        var origConsoleError = console.error;
        var origConsoleWarn = console.warn;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          if (args.some(function (a) { return typeof a === 'string' && a.indexOf(MSG) !== -1; })) return;
          return origConsoleError.apply(console, args);
        };
        console.warn = function () {
          var args = Array.prototype.slice.call(arguments);
          if (args.some(function (a) { return typeof a === 'string' && a.indexOf(MSG) !== -1; })) return;
          return origConsoleWarn.apply(console, args);
        };

        // 2. Catch thrown errors from @vite/client's WebSocket close handler
        window.addEventListener('error', function (e) {
          var msg = e.message || (e.error && e.error.message) || '';
          if (typeof msg === 'string' && msg.indexOf(MSG) !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var msg = (e.reason && e.reason.message) || '';
          if (typeof msg === 'string' && msg.indexOf(MSG) !== -1) {
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

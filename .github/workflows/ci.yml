name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "chore/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit remaining Base44 references
        run: node scripts/audit-base44-references.mjs

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

name: Fix unused imports (temporary)

on:
  push:
    branches: ["chore/fix-unused-imports-ci"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/fix-unused-imports-ci
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Auto-fix unused imports in files reported by CI
        run: |
          npx eslint --fix \
            src/components/LegalTemplateUploader.jsx \
            src/components/ads/AdForm.jsx \
            src/components/chat/ChatInput.jsx \
            src/components/crm/ClientFormModal.jsx \
            src/components/payment/PaymentMethodChoice.jsx \
            src/components/project/ProjectBIMSection.jsx \
            src/components/tasks/DocumentsPanel.jsx \
            src/pages/AIRenovation.jsx \
            src/pages/AdminDeveloperInvestorManagement.jsx \
            src/pages/AdminPlatformSettings.jsx \
            src/pages/AdminProviders.jsx \
            src/pages/AdminSearchGeoAnalytics.jsx \
            src/pages/AdminUserManagementCenter.jsx \
            src/pages/AdminWorkflowAutomation.jsx \
            src/pages/ContractArchive.jsx \
            src/pages/Dashboard.jsx \
            src/pages/GithubIssuesDashboard.jsx \
            src/pages/LinkedInManager.jsx \
            src/pages/RegisterConsultant.jsx \
            src/pages/RegisterContractor.jsx \
            src/pages/RegisterEngineer.jsx \
            src/pages/RegisterFirm.jsx \
            src/pages/RegisterLegalConsultant.jsx \
            src/pages/RegisterSupplier.jsx
      - name: Remove temporary fixer workflow
        run: rm .github/workflows/fix-unused-imports.yml
      - name: Commit only if files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components src/pages .github/workflows/fix-unused-imports.yml
          if git diff --cached --quiet; then
            echo "No changes were produced by ESLint autofix."
          else
            git commit -m "chore: fix unused imports reported by CI"
            git push origin chore/fix-unused-imports-ci
          fi
